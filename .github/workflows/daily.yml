name: Daily content and Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ops-radar-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Brandstar editorial picks
        continue-on-error: true
        run: python scripts/update_brandstar.py
      - name: Collect platform trending snapshots
        continue-on-error: true
        run: python scripts/update_trends.py
      - name: Translate global topic titles
        continue-on-error: true
        run: python scripts/translate_trends.py
      - name: Collect current headlines
        continue-on-error: true
        run: python scripts/update_news.py
      - name: Check JavaScript
        run: |
          node --check docs/dashboard.js
          node --check docs/brandstar.js
          node --check docs/sectors.js
          python scripts/test_translate.py
          python scripts/test_brandstar.py
          python scripts/test_global_trends.py
          node scripts/test_dashboard.cjs
      - name: Save daily content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/news.json docs/trends.json docs/history.json docs/history docs/brandstar.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily operations headlines [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
